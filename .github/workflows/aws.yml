# This workflow will build and push a new container image to Amazon ECR,
# and then will deploy a new task definition to Amazon ECS, when there is a push to the "main" branch.
#
# To use this workflow, you will need to complete the following set-up steps:
#
# 1. Create an ECR repository to store your images.
#    For example: `aws ecr create-repository --repository-name jannah-light-repo --region us-east-1`.
#
# 2. Create an ECS task definition, an ECS cluster, and an ECS service.
#    For example, follow the Getting Started guide on the ECS console:
#      https://us-east-1.console.aws.amazon.com/ecs/home?region=us-east-1#/firstRun
#
# 3. Store your ECS task definition as a JSON file in your repository.
#    The format should follow the output of `aws ecs register-task-definition --generate-cli-skeleton`.
#
# 4. Store an IAM user access key in GitHub Actions secrets named `AWS_ACCESS_KEY_ID` and `AWS_SECRET_ACCESS_KEY`.
#    See the documentation for each action used below for the recommended IAM policies for this IAM user,
#    and best practices on handling the access key credentials.

name: Deploy to Amazon ECS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: jannah-light-repo
  ECS_SERVICE: jannah-service
  ECS_CLUSTER: jannah-cluster
  ECS_TASK_DEFINITION: .aws/task-definition.json
  CONTAINER_NAME: jannah-container

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Verify required files exist
      run: |
        echo "🔍 Checking required files..."
        if [ ! -f "Dockerfile" ]; then
          echo "❌ Error: Dockerfile not found in root directory"
          exit 1
        fi
        if [ ! -f "${{ env.ECS_TASK_DEFINITION }}" ]; then
          echo "❌ Error: Task definition not found at ${{ env.ECS_TASK_DEFINITION }}"
          exit 1
        fi
        echo "✅ All required files exist"

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Build a docker container and
        # push it to ECR so that it can
        # be deployed to ECS.
        echo "🏗️ Building Docker image..."
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        
        echo "📤 Pushing image to ECR..."
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        
        echo "✅ Image pushed successfully"
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Fill in the new image ID in the Amazon ECS task definition
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: ${{ env.ECS_TASK_DEFINITION }}
        container-name: ${{ env.CONTAINER_NAME }}
        image: ${{ steps.build-image.outputs.image }}

    - name: Deploy Amazon ECS task definition
      id: deploy
      uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true
        force-new-deployment: true

    - name: Deployment successful
      if: success()
      run: |
        echo "✅ Deployment completed successfully!"
        echo "📍 Service: ${{ env.ECS_SERVICE }}"
        echo "📍 Cluster: ${{ env.ECS_CLUSTER }}"
        echo "📍 Region: ${{ env.AWS_REGION }}"
        echo "📍 Image: ${{ steps.build-image.outputs.image }}"

    - name: Deployment failed
      if: failure()
      run: |
        echo "❌ Deployment failed!"
        echo "Please check:"
        echo "1. ✓ AWS credentials (secrets) - AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY"
        echo "2. ✓ IAM permissions - ensure the user has ECR and ECS permissions"
        echo "3. ✓ ECR repository exists - ${{ env.ECR_REPOSITORY }}"
        echo "4. ✓ ECS service exists - ${{ env.ECS_SERVICE }}"
        echo "5. ✓ ECS cluster exists - ${{ env.ECS_CLUSTER }}"
        echo "6. ✓ Task definition file exists - ${{ env.ECS_TASK_DEFINITION }}"
        exit 1
