<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>جَنَّة لايت - فضاء تفاعلي | Jannah Light</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #000; color: white; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .top-logo { position: absolute; top: 15px; left: 0; right: 0; text-align: center; z-index: 20; font-size: 1.4rem; font-weight: bold; color: #d4af37; text-shadow: 0 0 15px rgba(212,175,55,0.8); background: transparent; pointer-events: none; letter-spacing: 1px; }
        .top-logo span { background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); padding: 5px 20px; border-radius: 40px; display: inline-block; font-size: 1rem; }
        .algeria-flag { position: absolute; bottom: 15px; right: 15px; z-index: 20; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); padding: 8px 12px; border-radius: 30px; display: flex; align-items: center; gap: 8px; font-size: 0.8rem; font-weight: bold; color: white; pointer-events: none; border: 1px solid #d4af37; }
        .flag-icon { font-size: 1.6rem; }
        .draggable-item { position: absolute; z-index: 15; cursor: grab; touch-action: none; user-select: none; transition: transform 0.2s, filter 0.3s; animation: float 4s infinite ease-in-out; will-change: left, top; }
        .draggable-item:active { cursor: grabbing; }
        .draggable-item:hover { filter: drop-shadow(0 0 12px rgba(212,175,55,0.8)); transform: scale(1.02); }
        .info-card { background: rgba(10, 10, 20, 0.75); backdrop-filter: blur(12px); border-radius: 24px; padding: 10px 18px; border: 1px solid rgba(212,175,55,0.5); box-shadow: 0 0 20px rgba(212,175,55,0.2), 0 4px 15px rgba(0,0,0,0.5); transition: all 0.2s; display: flex; align-items: center; gap: 12px; white-space: nowrap; font-size: 0.9rem; font-weight: bold; }
        .info-card i { font-size: 1.4rem; color: #d4af37; text-shadow: 0 0 10px #ffcc44; animation: iconGlow 1.5s infinite alternate; }
        .info-card .label { color: #ddd; margin-left: 5px; }
        .info-card .value { color: #00d4ff; font-weight: bold; text-shadow: 0 0 5px #00aaff; }
        .info-card .highlight { color: #ffaa33; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-5px); } 100% { transform: translateY(0px); } }
        @keyframes iconGlow { 0% { text-shadow: 0 0 2px #ffcc44; } 100% { text-shadow: 0 0 15px #ffaa22, 0 0 5px #ffcc44; } }
        @media (max-width: 700px) { .info-card { padding: 6px 12px; font-size: 0.7rem; white-space: nowrap; } .info-card i { font-size: 1rem; } .top-logo span { font-size: 0.7rem; } }
    </style>
</head>
<body>
    <div class="top-logo"><span>✨ Jannah Light Algérie ✨</span></div>
    <div class="algeria-flag"><span class="flag-icon">🇩🇿</span><span>صنع في الجزائر</span></div>
    <div id="item1" class="draggable-item" style="top: 10%; left: 5%;"><div class="info-card"><i class="fas fa-chart-line"></i><span class="label">💰 إجمالي الاستثمار :</span><span class="value highlight">8,956,392 دج</span></div></div>
    <div id="item2" class="draggable-item" style="top: 23%; left: 3%;"><div class="info-card"><i class="fas fa-industry"></i><span class="label">🏭 الإنتاج السنوي :</span><span class="value">60,000 وحدة</span></div></div>
    <div id="item3" class="draggable-item" style="top: 36%; left: 7%;"><div class="info-card"><i class="fas fa-building"></i><span class="label">📐 مساحة الورشة :</span><span class="value">200 م²</span></div></div>
    <div id="item4" class="draggable-item" style="top: 49%; left: 2%;"><div class="info-card"><i class="fas fa-users"></i><span class="label">👥 فريق العمل :</span><span class="value">8 عمال</span></div></div>
    <div id="item5" class="draggable-item" style="top: 62%; left: 8%;"><div class="info-card"><i class="fas fa-microchip"></i><span class="label">⚙️ آلات رئيسية :</span><span class="value">6 آلات</span></div></div>
    <div id="item6" class="draggable-item" style="top: 18%; right: 5%;"><div class="info-card"><i class="fas fa-boxes"></i><span class="label">📦 مخزون استراتيجي :</span><span class="value">6 أشهر</span></div></div>
    <div id="item7" class="draggable-item" style="top: 33%; right: 3%;"><div class="info-card"><i class="fas fa-trophy"></i><span class="label">🏆 سقف التمويل :</span><span class="value">10,000,000 دج</span></div></div>
    <div id="item8" class="draggable-item" style="top: 48%; right: 7%;"><div class="info-card"><i class="fas fa-certificate"></i><span class="label">✅ معايير عالمية :</span><span class="value">RoHS • IEC • LM-80</span></div></div>
    <div id="canvas-container"></div>
    <script type="importmap"> { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/" } } </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
         // ========== Three.js Scene ==========
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010118);
        scene.fog = new THREE.FogExp2(0x010118, 0.002);
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 2, 7);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        // الإضاءة
        const ambientLight = new THREE.AmbientLight(0x404060, 0.5);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(3, 5, 2);
        scene.add(dirLight);
        const backLight = new THREE.PointLight(0xd4af37, 0.7);
        backLight.position.set(-2, 1, -4);
        scene.add(backLight);
        // الأرض
        const textureLoader = new THREE.TextureLoader();
        const earthMap = textureLoader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg');
        const earthSpecularMap = textureLoader.load('https://threejs.org/examples/textures/planets/earth_specular_2048.jpg');
        const earthNormalMap = textureLoader.load('https://threejs.org/examples/textures/planets/earth_normal_2048.jpg');
        const cloudMap = textureLoader.load('https://threejs.org/examples/textures/planets/earth_clouds_1024.png');
        const earthMaterial = new THREE.MeshPhongMaterial({ map: earthMap, specularMap: earthSpecularMap, specular: new THREE.Color('grey'), shininess: 5, normalMap: earthNormalMap });
        const earth = new THREE.Mesh(new THREE.SphereGeometry(2.2, 128, 128), earthMaterial);
        scene.add(earth);
        const clouds = new THREE.Mesh(new THREE.SphereGeometry(2.22, 128, 128), new THREE.MeshPhongMaterial({ map: cloudMap, transparent: true, opacity: 0.15, blending: THREE.AdditiveBlending }));
        scene.add(clouds);
        // نجوم
        const starGeo = new THREE.BufferGeometry();
        const starCount = 1500;
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) { starPositions[i*3] = (Math.random() - 0.5) * 400; starPositions[i*3+1] = (Math.random() - 0.5) * 200; starPositions[i*3+2] = (Math.random() - 0.5) * 150 - 50; }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.12, transparent: true, opacity: 0.7 }));
        scene.add(stars);
        // مصابيح LED
        const leds = [];
        const ledColors = [0xff4444, 0x44ff44, 0x4444ff, 0xffdd44, 0xff44ff, 0x44ffdd];
        const ringRadius = 3.2;
        for (let i = 0; i < 36; i++) {
            const angle = (i / 36) * Math.PI * 2;
            const ledMat = new THREE.MeshStandardMaterial({ color: ledColors[i % ledColors.length], emissive: 0x442200, emissiveIntensity: 0.6 });
            const led = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), ledMat);
            led.position.x = Math.cos(angle) * ringRadius;
            led.position.z = Math.sin(angle) * ringRadius;
            led.position.y = Math.sin(angle * 2) * 0.5;
            scene.add(led);
            leds.push(led);
        }
        // جسيمات ذهبية
        const goldParticles = [];
        for (let i = 0; i < 200; i++) {
            const angle = (i / 200) * Math.PI * 2;
            const particle = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), new THREE.MeshStandardMaterial({ color: 0xd4af37, emissive: 0x442200 }));
            particle.position.x = Math.cos(angle) * (ringRadius + 0.2);
            particle.position.z = Math.sin(angle) * (ringRadius + 0.2);
            particle.position.y = Math.sin(angle * 3) * 0.3;
            scene.add(particle);
            goldParticles.push(particle);
        }
        // OrbitControls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.8;
        controls.enableZoom = true;
        controls.enablePan = false;
        controls.target.set(0, 0, 0);
        
        // ----- تحويل النسب المئوية إلى بكسل -----
        function convertPercentToPx() {
            document.querySelectorAll('.draggable-item').forEach(item => {
                let top = parseFloat(item.style.top);
                if (!isNaN(top) && item.style.top.includes('%')) item.style.top = (top/100)*window.innerHeight + 'px';
                let left = parseFloat(item.style.left);
                if (!isNaN(left) && item.style.left.includes('%')) item.style.left = (left/100)*window.innerWidth + 'px';
                if (item.style.right && item.style.right.includes('%')) {
                    let right = parseFloat(item.style.right);
                    item.style.right = (right/100)*window.innerWidth + 'px';
                    item.style.left = 'auto';
                }
            });
        }
        convertPercentToPx();
        
        // ----- القيود الرأسية (محسنة) -----
        function constrainVertical(draggedEl, desiredTop) {
            let all = Array.from(document.querySelectorAll('.draggable-item')).filter(el => el !== draggedEl);
            let above = null, below = null;
            let draggedHeight = draggedEl.offsetHeight;
            for (let item of all) {
                let t = parseFloat(item.style.top);
                let b = t + item.offsetHeight;
                if (b <= desiredTop + 5) { if (!above || t > parseFloat(above.style.top)) above = item; }
                if (t >= desiredTop + draggedHeight - 5) { if (!below || t < parseFloat(below.style.top)) below = item; }
            }
            if (above) { let limit = parseFloat(above.style.top) + above.offsetHeight + 10; if (desiredTop < limit) desiredTop = limit; }
            if (below) { let limit = parseFloat(below.style.top) - draggedHeight - 10; if (desiredTop > limit) desiredTop = limit; }
            return Math.min(window.innerHeight - draggedHeight - 10, Math.max(10, desiredTop));
        }
        
        // ----- جعل العناصر قابلة للسحب مع تقييد -----
        function makeDraggable(el) {
            let startX, startY, initLeft, initTop, dragging = false;
            el.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                dragging = true;
                startX = e.clientX ?? e.touches[0].clientX;
                startY = e.clientY ?? e.touches[0].clientY;
                initLeft = el.offsetLeft;
                initTop = parseFloat(el.style.top);
                el.style.cursor = 'grabbing';
                el.style.zIndex = '100';
            });
            window.addEventListener('pointermove', (e) => {
                if (!dragging) return;
                e.preventDefault();
                let dx = (e.clientX ?? e.touches[0].clientX) - startX;
                let dy = (e.clientY ?? e.touches[0].clientY) - startY;
                let newLeft = initLeft + dx;
                let newTop = initTop + dy;
                newTop = constrainVertical(el, newTop);
                newLeft = Math.min(window.innerWidth - el.offsetWidth - 10, Math.max(10, newLeft));
                el.style.left = newLeft + 'px';
                el.style.top = newTop + 'px';
                el.style.right = 'auto';
            });
            window.addEventListener('pointerup', () => {
                dragging = false;
                el.style.cursor = 'grab';
                el.style.zIndex = '15';
            });
        }
        document.querySelectorAll('.draggable-item').forEach(el => makeDraggable(el));
        
        // ----- حلقة الرسم Three.js -----
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.008;
            earth.rotation.y += 0.002;
            clouds.rotation.y += 0.0023;
            leds.forEach((led, idx) => {
                let angle = (Date.now() * 0.001 + idx * 0.2) % (Math.PI * 2);
                led.position.x = Math.cos(angle) * ringRadius;
                led.position.z = Math.sin(angle) * ringRadius;
                led.position.y = Math.sin(angle * 2) * 0.5;
                led.material.emissiveIntensity = 0.5 + Math.sin(Date.now() * 0.005 + idx) * 0.4;
            });
            goldParticles.forEach((p, idx) => {
                let angle = (Date.now() * 0.0015 + idx * 0.05) % (Math.PI * 2);
                p.position.x = Math.cos(angle) * (ringRadius + 0.25);
                p.position.z = Math.sin(angle) * (ringRadius + 0.25);
                p.position.y = Math.sin(angle * 4) * 0.2;
            });
            stars.rotation.y += 0.0003;
            stars.rotation.x += 0.0002;
            backLight.intensity = 0.6 + Math.sin(time * 0.8) * 0.3;
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    </script>
</body>
</html>
