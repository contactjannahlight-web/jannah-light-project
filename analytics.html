<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jannah Light - الرؤية التحليلية</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700;900&family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Tajawal', 'Poppins', sans-serif;
            background: #0a0e1a;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 1.5rem;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(18,52,114,0.25) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(212,175,55,0.10) 0%, transparent 60%);
        }
        .dashboard {
            max-width: 1300px; width: 100%;
            background: rgba(10,14,30,0.75);
            backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(212,175,55,0.15);
            border-radius: 2.5rem;
            padding: 2.5rem 2.8rem 3rem;
            box-shadow: 0 30px 80px rgba(0,0,0,0.8), inset 0 0 60px rgba(212,175,55,0.03);
        }
        .header {
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap; gap: 1.5rem 2rem; margin-bottom: 2.8rem;
        }
        .logo-wrap { display: flex; align-items: center; gap: 1.2rem; }
        .logo-ring {
            width: 82px; height: 82px; border-radius: 50%;
            background: linear-gradient(135deg, #0b1428, #132044);
            border: 2.5px solid rgba(212,175,55,0.5);
            box-shadow: 0 0 30px rgba(212,175,55,0.12), inset 0 0 40px rgba(212,175,55,0.04);
            display: flex; align-items: center; justify-content: center;
            position: relative; flex-shrink: 0;
        }
        .logo-ring::after {
            content: ''; position: absolute; inset: -4px; border-radius: 50%;
            background: conic-gradient(from 120deg, transparent 0%, rgba(212,175,55,0.2) 30%, transparent 60%, rgba(192,192,192,0.15) 85%, transparent 100%);
            -webkit-mask: radial-gradient(farthest-side, transparent 68%, #000 72%);
            mask: radial-gradient(farthest-side, transparent 68%, #000 72%);
            pointer-events: none;
        }
        .logo-inner { position: relative; width: 58px; height: 58px; display: flex; align-items: center; justify-content: center; }
        .crescent-star { width: 52px; height: 52px; }
        .title-group { display: flex; flex-direction: column; line-height: 1.1; }
        .title-jannah {
            font-family: 'Poppins', sans-serif; font-weight: 900;
            font-size: 2.4rem; letter-spacing: 2px;
            background: linear-gradient(135deg, #e8e8e8 0%, #c0c0c0 40%, #a8a8a8 70%, #d4d4d4 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .title-light {
            font-family: 'Poppins', sans-serif; font-weight: 900;
            font-size: 2.4rem; letter-spacing: 4px;
            background: linear-gradient(135deg, #f5d77b 0%, #d4af37 35%, #f0d68a 60%, #b8942e 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            margin-top: -4px;
        }
        .title-sub {
            font-family: 'Tajawal', sans-serif; font-weight: 300;
            font-size: 0.85rem; color: rgba(192,192,192,0.5);
            letter-spacing: 3px; margin-top: 2px;
        }
        .bulb-badge {
            display: flex; align-items: center; gap: 0.6rem;
            background: rgba(212,175,55,0.06);
            border: 1px solid rgba(212,175,55,0.15);
            border-radius: 60px; padding: 0.25rem 1.2rem 0.25rem 0.8rem;
            backdrop-filter: blur(8px);
            transition: box-shadow 0.3s;
        }
        .bulb-badge:hover {
            box-shadow: 0 0 15px rgba(212,175,55,0.4);
        }
        .bulb-icon { width: 40px; height: 48px; display: flex; align-items: center; justify-content: center; animation: floatIcon 3s ease-in-out infinite; }
        .bulb-svg { width: 38px; height: 46px; filter: drop-shadow(0 0 18px rgba(212,175,55,0.20)); transition: filter 0.3s; }
        .bulb-badge:hover .bulb-svg { filter: drop-shadow(0 0 12px #d4af37); }
        .bulb-label { font-family: 'Tajawal', sans-serif; font-weight: 400; font-size: 0.80rem; color: rgba(192,192,192,0.7); line-height: 1.3; }
        .bulb-label strong {
            display: block; font-weight: 700; font-size: 0.95rem;
            background: linear-gradient(135deg, #d4af37, #f5d77b);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.8rem; margin-top: 0.6rem; }
        .card {
            background: rgba(12,18,38,0.55); backdrop-filter: blur(10px);
            border: 1px solid rgba(212,175,55,0.08); border-radius: 1.8rem;
            padding: 1.6rem 1.8rem 1.8rem;
            box-shadow: 0 8px 40px rgba(0,0,0,0.35); transition: all 0.4s ease;
        }
        .card:hover { border-color: rgba(212,175,55,0.18); box-shadow: 0 12px 60px rgba(0,0,0,0.5); }
        .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.8rem; }
        .card-title { font-family: 'Tajawal', sans-serif; font-weight: 700; font-size: 1.05rem; color: rgba(192,192,192,0.85); }
        .card-title i {
            color: #d4af37; margin-left: 6px; opacity: 0.9;
            animation: floatIcon 2s ease-in-out infinite;
            filter: drop-shadow(0 0 4px rgba(212,175,55,0.6));
            transition: 0.2s;
        }
        .card-title i:hover {
            filter: drop-shadow(0 0 12px #d4af37);
            transform: scale(1.05);
        }
        .card-badge {
            font-size: 0.7rem; padding: 0.2rem 0.8rem; border-radius: 40px;
            background: rgba(212,175,55,0.10); border: 1px solid rgba(212,175,55,0.12);
            color: rgba(212,175,55,0.6); font-weight: 300;
        }
        .chart-container { position: relative; width: 100%; max-height: 220px; height: 200px; }
        .full-row { grid-column: 1 / -1; }
        .full-row .chart-container { max-height: 200px; height: 180px; }
        .metrics {
            display: grid; grid-template-columns: repeat(4,1fr); gap: 1.2rem; margin-top: 2rem;
        }
        .metric {
            text-align: center; padding: 0.9rem 0.4rem; border-radius: 1.2rem;
            background: rgba(12,18,38,0.35); border: 1px solid rgba(212,175,55,0.06);
            transition: all 0.4s ease;
        }
        .metric:hover {
            border-color: rgba(212,175,55,0.3);
            background: rgba(12,18,38,0.7);
            box-shadow: 0 0 20px rgba(212,175,55,0.2);
        }
        .metric-value {
            font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 1.6rem;
            background: linear-gradient(135deg, #d4af37, #f5d77b);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .metric-label {
            font-family: 'Tajawal', sans-serif; font-weight: 300; font-size: 0.75rem;
            color: rgba(192,192,192,0.5); margin-top: 2px;
        }
        .metric-label i {
            margin-left: 4px; opacity: 0.8;
            animation: floatIcon 2.5s ease-in-out infinite;
            filter: drop-shadow(0 0 2px rgba(212,175,55,0.5));
        }
        @keyframes floatIcon {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-4px) rotate(3deg); text-shadow: 0 0 8px rgba(212,175,55,0.8); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        @media (max-width: 900px) {
            .grid { grid-template-columns: 1fr; }
            .metrics { grid-template-columns: repeat(2,1fr); }
            .title-jannah, .title-light { font-size: 1.8rem; }
            .header { flex-direction: column; align-items: flex-start; }
        }
        @media (max-width: 480px) {
            .title-jannah, .title-light { font-size: 1.4rem; }
            .metrics { grid-template-columns: 1fr 1fr; }
            .metric-value { font-size: 1.2rem; }
        }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: rgba(10,14,30,0.6); }
        ::-webkit-scrollbar-thumb { background: rgba(212,175,55,0.25); border-radius: 10px; }
    </style>
</head>
<body>
<div class="dashboard">

    <div class="header">
        <div class="logo-wrap">
            <div class="logo-ring">
                <div class="logo-inner">
                    <svg class="crescent-star" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M68 20 C80 35 80 65 68 80 C75 70 78 55 75 40 C72 28 64 22 68 20Z" fill="url(#goldGrad)" opacity="0.95"/>
                        <path d="M52 32 L56 44 L69 44 L58 53 L62 66 L52 57 L42 66 L46 53 L35 44 L48 44Z" fill="url(#goldGrad)" opacity="0.95"/>
                        <circle cx="72" cy="28" r="2.5" fill="#f5d77b" opacity="0.6"/>
                        <defs>
                            <linearGradient id="goldGrad" x1="20" y1="20" x2="80" y2="80">
                                <stop offset="0%" stop-color="#f5d77b"/>
                                <stop offset="40%" stop-color="#d4af37"/>
                                <stop offset="70%" stop-color="#f0d68a"/>
                                <stop offset="100%" stop-color="#b8942e"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
            </div>
            <div class="title-group">
                <div class="title-jannah">JANNAH</div>
                <div class="title-light">LIGHT</div>
                <div class="title-sub">— إضاءة المستقبل —</div>
            </div>
        </div>
        <div class="bulb-badge">
            <div class="bulb-icon">
                <svg class="bulb-svg" viewBox="0 0 40 50" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20 3 C12 3 7 11 7 19 C7 26 11 31 14 34 L14 38 C14 40 16 42 20 42 C24 42 26 40 26 38 L26 34 C29 31 33 26 33 19 C33 11 28 3 20 3Z" fill="url(#bulbBlue)" stroke="url(#bulbGold)" stroke-width="1.2" opacity="0.9"/>
                    <path d="M16 28 L18 22 L20 28 L22 22 L24 28" stroke="#f5d77b" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.9"/>
                    <circle cx="20" cy="26" r="3" fill="#f5d77b" opacity="0.25"/>
                    <rect x="16" y="40" width="8" height="3" rx="1" fill="url(#bulbGold)" opacity="0.7"/>
                    <rect x="17" y="43" width="6" height="2" rx="0.8" fill="url(#bulbGold)" opacity="0.5"/>
                    <defs>
                        <linearGradient id="bulbBlue" x1="8" y1="4" x2="32" y2="46">
                            <stop offset="0%" stop-color="#1a3a6a"/>
                            <stop offset="50%" stop-color="#0f2548"/>
                            <stop offset="100%" stop-color="#08152e"/>
                        </linearGradient>
                        <linearGradient id="bulbGold" x1="8" y1="4" x2="32" y2="46">
                            <stop offset="0%" stop-color="#f5d77b"/>
                            <stop offset="50%" stop-color="#d4af37"/>
                            <stop offset="100%" stop-color="#b8942e"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <div class="bulb-label">
                <strong>LED · صنع في الجزائر</strong>
                الجودة والابتكار
            </div>
        </div>
    </div>

    <div class="grid">
        <div class="card">
            <div class="card-header">
                <span class="card-title"><i class="fa-solid fa-bolt"></i> تطور الإنتاج (وحدات)</span>
                <span class="card-badge">شهري · تجريبي</span>
            </div>
            <div class="chart-container"><canvas id="chartEnergy"></canvas></div>
        </div>
        <div class="card">
            <div class="card-header">
                <span class="card-title"><i class="fa-regular fa-lightbulb"></i> كفاءة الطاقة والجودة</span>
                <span class="card-badge">نموذج أولي</span>
            </div>
            <div class="chart-container"><canvas id="chartEfficiency"></canvas></div>
        </div>
        <div class="card full-row">
            <div class="card-header">
                <span class="card-title"><i class="fa-regular fa-chart-bar"></i> توزيع الإنتاج حسب الفئة المستهدفة</span>
                <span class="card-badge">خطة أولية</span>
            </div>
            <div class="chart-container"><canvas id="chartDistribution"></canvas></div>
        </div>
    </div>

    <div class="metrics">
        <div class="metric">
            <div class="metric-value">≥ 60K</div>
            <div class="metric-label"><i class="fa-regular fa-calendar"></i> وحدات / سنوياً</div>
        </div>
        <div class="metric">
            <div class="metric-value">95%+</div>
            <div class="metric-label"><i class="fa-regular fa-chart-line"></i> معامل جودة</div>
        </div>
        <div class="metric">
            <div class="metric-value">24</div>
            <div class="metric-label"><i class="fa-regular fa-handshake"></i> شهراً ضمان</div>
        </div>
        <div class="metric">
            <div class="metric-value">🇩🇿</div>
            <div class="metric-label"><i class="fa-regular fa-flag"></i> صنع في الجزائر</div>
        </div>
    </div>
</div>

<script>
(function() {
    const gold      = '#d4af37';
    const goldLight = '#f5d77b';
    const goldDark  = '#b8942e';
    const blueMid   = '#1a3a6a';
    const silver    = '#c0c0c0';
    const silverLight = '#e8e8e8';
    const gridColor = 'rgba(212,175,55,0.06)';
    const textColor = 'rgba(192,192,192,0.6)';

    function makeGrad(ctx, chartArea, c1, c2, c3) {
        const g = ctx.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
        g.addColorStop(0,   c1 || goldLight);
        g.addColorStop(0.5, c2 || gold);
        g.addColorStop(1,   c3 || goldDark);
        return g;
    }

    const tip = {
        backgroundColor: 'rgba(10,14,30,0.85)',
        titleColor: goldLight, bodyColor: silverLight,
        borderColor: gold, borderWidth: 1, padding: 10, cornerRadius: 8,
    };

    new Chart(document.getElementById('chartEnergy').getContext('2d'), {
        type: 'line',
        data: {
            labels: ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو'],
            datasets: [{
                label: 'الوحدات المنتجة (بالآلاف)',
                data: [5.2, 5.8, 6.4, 7.1, 8.0, 9.2],
                borderColor: gold,
                backgroundColor: function(c) {
                    const {ctx, chartArea} = c.chart;
                    if (!chartArea) return gold;
                    return makeGrad(ctx, chartArea, 'rgba(212,175,55,0.35)', 'rgba(212,175,55,0.12)', 'rgba(212,175,55,0.01)');
                },
                fill: true, tension: 0.35,
                pointBackgroundColor: goldLight, pointBorderColor: goldDark,
                pointRadius: 4, pointHoverRadius: 7, borderWidth: 2.5,
            }]
        },
        options: {
            responsive: true, maintainAspectRatio: true,
            plugins: { legend: { display: false }, tooltip: tip },
            scales: {
                x: { grid: { color: gridColor }, ticks: { color: textColor, font: { size: 10, family: 'Tajawal' } } },
                y: { grid: { color: gridColor }, ticks: { color: textColor, font: { size: 10, family: 'Tajawal' } }, beginAtZero: true }
            },
            layout: { padding: { top: 10, bottom: 4, left: 4, right: 8 } }
        }
    });

    new Chart(document.getElementById('chartEfficiency').getContext('2d'), {
        type: 'doughnut',
        data: {
            labels: ['تشغيل فعال', 'فقد حراري', 'فقد كهربائي'],
            datasets: [{
                data: [78, 14, 8],
                backgroundColor: [gold, blueMid, '#1e2d50'],
                borderColor: 'rgba(10,14,30,0.8)',
                borderWidth: 2, hoverOffset: 10,
            }]
        },
        options: {
            responsive: true, maintainAspectRatio: true, cutout: '62%',
            plugins: {
                legend: {
                    position: 'bottom',
                    labels: { color: silver, font: { size: 10, family: 'Tajawal' }, padding: 12, usePointStyle: true, pointStyle: 'circle' }
                },
                tooltip: { ...tip, callbacks: { label: c => c.label + ': ' + c.parsed + '%' } }
            },
            layout: { padding: { top: 10, bottom: 4, left: 4, right: 4 } }
        }
    });

    new Chart(document.getElementById('chartDistribution').getContext('2d'), {
        type: 'bar',
        data: {
            labels: ['سكني', 'تجاري', 'صناعي', 'خدمات عمومية', 'طاقة شمسية', 'تصدير'],
            datasets: [{
                label: 'النسبة المئوية',
                data: [30, 25, 18, 12, 10, 5],
                backgroundColor: function(c) {
                    const {ctx, chartArea} = c.chart;
                    if (!chartArea) return gold;
                    return makeGrad(ctx, chartArea, goldLight, gold, goldDark);
                },
                borderColor: 'rgba(10,14,30,0.6)',
                borderWidth: 1.2, borderRadius: 6, barPercentage: 0.65,
            }]
        },
        options: {
            indexAxis: 'y',
            responsive: true, maintainAspectRatio: true,
            plugins: {
                legend: { display: false },
                tooltip: { ...tip, callbacks: { label: c => c.parsed.x + '%' } }
            },
            scales: {
                x: { grid: { color: gridColor }, ticks: { color: textColor, font: { size: 10, family: 'Tajawal' } }, beginAtZero: true, max: 35 },
                y: { grid: { display: false }, ticks: { color: silver, font: { size: 11, family: 'Tajawal' } } }
            },
            layout: { padding: { top: 6, bottom: 4, left: 4, right: 8 } }
        }
    });
})();
</script>
</body>
</html>
